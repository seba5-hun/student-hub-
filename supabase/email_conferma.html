<!-- MYND · Email "Confirm signup": solo il codice, nessun link.
     Supabase → Authentication → Emails → "Confirm signup":
     Oggetto:  Il tuo codice MYND: {{ .Token }}
     Corpo:    incolla tutto quello che c'è qui sotto. -->
<div style="margin:0;padding:32px 16px;background:#0A0B0C;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#ECEEF0">
  <div style="max-width:440px;margin:0 auto;background:#141618;border:1px solid #2A2D31;border-radius:24px;padding:32px 28px;text-align:center">
    <p style="margin:0 0 20px;font-size:20px;font-weight:600;letter-spacing:-0.03em">M<span style="color:#C8F25A">Y</span>ND</p>
    <p style="margin:0 0 16px;font-size:16px;line-height:1.5;color:#B4B9BF">Il tuo codice è</p>
    <p style="margin:0 0 20px;padding:18px 0;background:#0A0B0C;border-radius:16px;font-size:40px;font-weight:700;letter-spacing:10px;color:#C8F25A">{{ .Token }}</p>
    <p style="margin:0;font-size:15px;line-height:1.5;color:#B4B9BF">Scrivilo in MYND e hai finito.</p>
  </div>
  <p style="max-width:440px;margin:16px auto 0;font-size:11px;color:#6B7177;text-align:center">Non sei stato tu? Ignora questa email.</p>
</div>
